const sb=supabase.createClient('https://tlcjcqqnfjrqsoiaalfk.supabase.co','sb_publishable_Q05ypFa4Ele00vyzy5X9Rw_tBWEJuvr');let session,data;const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Không thể thực hiện');return d}

function openRole(id){const u=data.users.find(x=>x.id===id);if(!u)return;$('#modal-title').textContent='Quản lý quyền tài khoản';$('#modal-body').innerHTML=`<p>${esc(u.email||u.id)}</p><select id="role-value" class="input"><option value="viewer">Viewer</option><option value="analyst">Analyst</option><option value="operator">Operator</option><option value="manager">Manager</option><option value="platform_admin">Platform Admin</option><option value="super_admin">Super Admin</option></select><p><button id="role-save" class="btn2 primary">Lưu vai trò</button> <span id="role-msg" class="muted"></span></p>`;$('#role-value').value=u.role||'viewer';$('#modal').classList.remove('hidden');$('#role-save').onclick=async()=>{try{await api('/api/admin/access',{method:'POST',body:JSON.stringify({action:'set_user_role',user_id:id,role:$('#role-value').value})});$('#role-msg').textContent='Đã lưu';await load()}catch(e){$('#role-msg').textContent=e.message}}}
function openHandover(){const us=data.users.filter(u=>u.role!=='platform_admin'&&u.status!=='deleted');$('#modal-title').textContent='Bàn giao tài sản';$('#modal-body').innerHTML=`<p class="muted">Chuyển Page, Payout, nhóm và tuyến quản lý trước khi đình chỉ/xóa.</p><div class="grid"><select id="old" class="input">${us.map(u=>`<option value="${u.id}">${esc(u.email||u.display_name)}</option>`).join('')}</select><select id="new" class="input">${us.map(u=>`<option value="${u.id}">${esc(u.email||u.display_name)}</option>`).join('')}</select><select id="final" class="input"><option value="suspended">Đình chỉ</option><option value="deleted">Xóa</option></select></div><p><button id="handover" class="btn2 primary">Xác nhận bàn giao</button> <span id="handover-msg" class="muted"></span></p>`;$('#modal').classList.remove('hidden');$('#handover').onclick=async()=>{if($('#old').value===$('#new').value){$('#handover-msg').textContent='Chọn hai tài khoản khác nhau';return}try{const x=await api('/api/admin/access',{method:'POST',body:JSON.stringify({action:'offboard_user',user_id:$('#old').value,successor_user_id:$('#new').value,final_status:$('#final').value})});$('#handover-msg').textContent=`Đã chuyển ${x.transferred.pages} Page và ${x.transferred.payment_profiles} Payout`;await load()}catch(e){$('#handover-msg').textContent=e.message}}}
async function load(){data=await api('/api/admin/access');render();$('#status').textContent=`${data.users.length} tài khoản · ${data.access.length} quyền Page · ${data.payment_access.length} quyền Payout`;$('#app').classList.remove('hidden')}
['search','filter','role-filter'].forEach(id=>$('#'+id).oninput=render);$('#close').onclick=()=>$('#modal').classList.add('hidden');$('#handover-open').onclick=openHandover;document.addEventListener('click',async e=>{const preview=e.target.closest?.('[data-preview-id]');if(preview){preview.disabled=true;try{if(!session?.access_token)throw Error('Phiên đăng nhập đã hết hạn');const result=await api('/api/admin/preview',{method:'POST',body:JSON.stringify({user_id:preview.dataset.previewId,user_email:preview.dataset.previewEmail||''})});sessionStorage.setItem('adminPreviewToken',result.token);document.cookie=`adminPreviewToken=${encodeURIComponent(result.token)}; Max-Age=900; Path=/; SameSite=Lax`;location.href='/analytics?preview=1'}catch(error){$('#status').textContent=error.message;preview.disabled=false}return}if(e.target.dataset.edit)openRole(e.target.dataset.edit);if(e.target.dataset.status){try{await api('/api/admin/access',{method:'POST',body:JSON.stringify({action:'set_user_status',user_id:e.target.dataset.status,status:e.target.dataset.next})});await load()}catch(x){$('#status').textContent=x.message}}});(async()=>{const x=await sb.auth.getSession();session=x.data.session;if(!session){$('#status').textContent='Hãy đăng nhập Google trước.';return}try{const p=await api('/api/auth/profile');if(!['platform_admin','super_admin'].includes(p.profile.role))throw Error('Chỉ quản trị viên được quản lý nhân sự');await load()}catch(e){$('#status').textContent=e.message}})();</script><script src="/auth-nav.js?v=20261102-4"></script></body></html>
