<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký hợp tác</title><link rel="stylesheet" href="system.css?v=20261101-5"><style>main{padding:80px 0}.form{max-width:630px;padding:30px;background:#151c20;border:1px solid #354144;border-radius:9px}.input{width:100%;padding:14px;border:1px solid #445155;background:#0c1114;color:#fff;border-radius:6px;margin:8px 0 16px;font:14px Manrope}.status{color:#c1c7c8;line-height:1.6}</style></head><body><nav class="nav"><div class="wrap"><a class="brand" href="index.html">AI<span>/</span>FB MONEY</a></div></nav><main class="wrap"><div class="form"><p class="tag">PARTNER / CUSTOMER APPLICATION</p><h1>Đăng ký<br><em>hợp tác</em></h1><p class="status">Sau khi duyệt, chúng tôi sẽ liên hệ và gửi lời mời quyền truy cập phù hợp. Không gửi mật khẩu Facebook hoặc mã xác thực qua form này.</p><form id="form"><label>Họ và tên</label><input class="input" id="name" required autocomplete="name"><label>Email nhận lời mời Meta</label><input class="input" id="email" required type="email" autocomplete="email"><label>Nhu cầu quyền truy cập</label><select class="input" id="task"><option value="ANALYZE">Xem chỉ số — ANALYZE</option><option value="CREATE_CONTENT">Sản xuất nội dung — CREATE_CONTENT</option><option value="MODERATE">Kiểm duyệt — MODERATE</option></select><button class="btn">GỬI ĐĂNG KÝ ↗</button></form><p class="status" id="status"></p></div></main><script>const deal=new URLSearchParams(location.search).get('deal'),$=s=>document.querySelector(s);if(!deal){$('#form').style.display='none';$('#status').textContent='Link đăng ký không hợp lệ: thiếu mã giao dịch.'}$('#form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/public/application',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({deal_id:deal,name:$('#name').value,email:$('#email').value,requested_task:$('#task').value})}),data=await r.json();$('#status').textContent=r.ok?'Đã nhận đăng ký. Chúng tôi sẽ kiểm tra và liên hệ qua email.':data.error||'Không thể gửi đăng ký.';if(r.ok)e.target.reset()};</script></body></html>
