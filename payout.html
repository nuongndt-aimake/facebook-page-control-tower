</style></head><body><nav class="quick-nav"><div><a href="/analytics">Tổng quan</a><a href="/report-pages">Page</a><a href="/report-content">Nội dung</a><a href="/report-revenue">Doanh thu</a><a href="/payout">Payout</a><a href="/commissions">Hoa hồng</a><a href="/groups">Nhóm</a><a href="/users">Nhân sự</a><a href="/account">Tài khoản</a></div></nav><main class="wrap"><p class="tag">PAYOUT REGISTRY</p><h1>Hồ sơ thanh toán</h1><p id="status" class="muted">Đang tải…</p><section id="app" class="hidden"><div class="toolbar"><input id="search" class="input" placeholder="Tìm hồ sơ, người nhận, BM"><select id="filter" class="input"><option value="">Tất cả trạng thái</option><option value="active">Đang hoạt động</option><option value="paused">Tạm dừng</option><option value="closed">Đã đóng</option></select><button id="create" class="btn2 primary">+ Tạo hồ sơ</button><button id="relations" class="btn2">Liên kết Page / cấp quyền</button></div><div class="cards"><div class="summary"><b id="total">0</b>Tổng hồ sơ</div><div class="summary"><b id="active">0</b>Đang hoạt động</div><div class="summary"><b id="linked">0</b>Hồ sơ có Page</div></div><section class="card"><h2>Danh sách hồ sơ</h2><div id="profiles"></div></section></section></main><div id="modal" class="modal hidden"><div class="modal-panel"><div class="toolbar"><h2 id="modal-title"></h2><button id="close" class="btn2">Đóng</button></div><div id="modal-body"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1"></script><script>
const sb=supabase.createClient('https://tlcjcqqnfjrqsoiaalfk.supabase.co','sb_publishable_Q05ypFa4Ele00vyzy5X9Rw_tBWEJuvr');let session,data;const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Không thể thực hiện');return d}
function render(){const q=($('#search').value||'').toLowerCase(),st=$('#filter').value,links=new Map;(data.links||[]).forEach(l=>{if(!links.has(l.payment_profile_id))links.set(l.payment_profile_id,[]);links.get(l.payment_profile_id).push(l.page_id)});const rows=(data.payment_profiles||[]).filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!st||p.status===st));$('#total').textContent=data.payment_profiles.length;$('#active').textContent=data.payment_profiles.filter(p=>p.status==='active').length;$('#linked').textContent=data.payment_profiles.filter(p=>(links.get(p.id)||[]).length).length;$('#profiles').innerHTML=`<table class="table"><thead><tr><th>#</th><th>Hồ sơ</th><th>Người nhận</th><th>BM</th><th>Facebook quản lý</th><th>Page liên kết</th><th>Trạng thái</th></tr></thead><tbody>${rows.map((p,i)=>`<tr><td data-label="#">${i+1}</td><td data-label="Hồ sơ"><strong>${esc(p.profile_name||'Chưa đặt tên')}</strong><br>${esc(p.external_id)}</td><td data-label="Người nhận">${esc(p.recipient_name||'—')}<br>${esc(p.recipient_account||p.receiving_account_name||'—')}</td><td data-label="BM">${esc(p.business_id||'—')}</td><td data-label="Facebook quản lý">${esc(p.managed_by_facebook_user_id||'—')}</td><td data-label="Page liên kết">${esc((links.get(p.id)||[]).join(', ')||'Chưa gắn')}</td><td data-label="Trạng thái"><span class="pill">${esc(p.status||'unknown')}</span></td></tr>`).join('')}</tbody></table>`}
function openProfile(){openModal('Tạo hồ sơ thanh toán','<div class="grid"><input id="external" class="input" placeholder="ID hồ sơ ngoài"><input id="name" class="input" placeholder="Tên hồ sơ"><input id="recipient" class="input" placeholder="Người nhận tiền"><input id="account" class="input" placeholder="Tài khoản nhận"><input id="bm" class="input" placeholder="BM ID"><input id="fb" class="input" placeholder="Facebook User ID quản lý"><select id="profile-status" class="input"><option value="active">Đang hoạt động</option><option value="paused">Tạm dừng</option><option value="closed">Đã đóng</option></select></div><p><button id="profile-save" class="btn2 primary">Lưu hồ sơ</button> <span id="profile-msg" class="muted"></span></p>');$('#profile-save').onclick=async()=>{try{await api('/api/admin/payment-profiles',{method:'POST',body:JSON.stringify({action:'upsert_profile',external_id:$('#external').value,profile_name:$('#name').value,recipient_name:$('#recipient').value,recipient_account:$('#account').value,business_id:$('#bm').value,managed_by_facebook_user_id:$('#fb').value,status:$('#profile-status').value})});closeModal();await load()}catch(e){$('#profile-msg').textContent=e.message}}}
function openRelations(){const ps=data.pages||[],us=data.users||[],profiles=data.payment_profiles||[];openModal('Liên kết Page và cấp quyền Payout','<p class="muted">Chọn Page, hồ sơ và người dùng. Các thao tác được lưu độc lập.</p><div class="grid"><select id="rel-page" class="input">'+ps.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.id}</option>`).join('')+'</select><select id="rel-profile" class="input">'+profiles.map(p=>`<option value="${p.id}">${esc(p.profile_name||p.external_id)}</option>`).join('')+'</select><button id="rel-link" class="btn2 primary">Gắn Page vào hồ sơ</button><select id="rel-user" class="input">'+us.filter(u=>u.role!=='platform_admin').map(u=>`<option value="${u.id}">${esc(u.email||u.display_name)}</option>`).join('')+'</select><select id="rel-level" class="input"><option value="viewer">Chỉ xem</option><option value="manager">Quản lý</option></select><button id="rel-grant" class="btn2 primary">Cấp quyền Payout</button></div><p id="rel-msg" class="muted"></p>');$('#rel-link').onclick=async()=>{try{await api('/api/admin/payment-profiles',{method:'POST',body:JSON.stringify({action:'link_page',page_id:$('#rel-page').value,payment_profile_id:$('#rel-profile').value})});$('#rel-msg').textContent='Đã gắn Page';await load()}catch(e){$('#rel-msg').textContent=e.message}};$('#rel-grant').onclick=async()=>{try{await api('/api/admin/payment-profiles',{method:'POST',body:JSON.stringify({action:'grant_payment_profile',user_id:$('#rel-user').value,payment_profile_id:$('#rel-profile').value,access_level:$('#rel-level').value})});$('#rel-msg').textContent='Đã cấp quyền'}catch(e){$('#rel-msg').textContent=e.message}}}
function openModal(t,html){$('#modal-title').textContent=t;$('#modal-body').innerHTML=html;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
async function load(){data=await api('/api/admin/payment-profiles');data.payment_profiles=data.payment_profiles||data.profiles||[];data.links=data.links||[];render();$('#status').textContent=`${data.payment_profiles.length} hồ sơ thanh toán`;$('#app').classList.remove('hidden')}
$('#create').onclick=openProfile;$('#relations').onclick=openRelations;$('#close').onclick=closeModal;['search','filter'].forEach(id=>$('#'+id).oninput=render);(async()=>{const x=await sb.auth.getSession();session=x.data.session;if(!session){$('#status').textContent='Hãy đăng nhập Google trước.';return}try{const p=await api('/api/auth/profile');if(!['platform_admin','super_admin'].includes(p.profile.role))throw Error('Chưa được cấp quyền quản lý Payout');await load()}catch(e){$('#status').textContent=e.message}})();</script><script src="/auth-nav.js?v=20261101-9"></script></body></html>
