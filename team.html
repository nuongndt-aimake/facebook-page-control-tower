const sb=supabase.createClient('https://tlcjcqqnfjrqsoiaalfk.supabase.co','sb_publishable_Q05ypFa4Ele00vyzy5X9Rw_tBWEJuvr');let session,data;const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Không thể thực hiện');return d}function userName(id){const u=(data.users||[]).find(x=>String(x.id)===String(id));return u?.display_name||u?.email||id}function render(){const q=($('#search').value||'').toLowerCase();const rows=(data.reporting_lines||[]).filter(line=>`${userName(line.manager_user_id)} ${userName(line.employee_user_id)}`.toLowerCase().includes(q));$('#lines').innerHTML=rows.length?`<table class="table"><thead><tr><th>#</th><th>Quản lý</th><th>Nhân viên</th><th>Hiệu lực</th><th>Thao tác</th></tr></thead><tbody>${rows.map((line,i)=>`<tr><td data-label="#">${i+1}</td><td data-label="Quản lý"><strong>${esc(userName(line.manager_user_id))}</strong><br><span class="muted">${esc(line.manager_user_id)}</span></td><td data-label="Nhân viên">${esc(userName(line.employee_user_id))}<br><span class="muted">${esc(line.employee_user_id)}</span></td><td data-label="Trạng thái"><span class="pill">${esc(line.status)}</span></td><td data-label="Thao tác"><button class="btn2" data-end="${esc(line.employee_user_id)}">Kết thúc</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">Chưa có quan hệ quản lý nào.</p>'}function fill(){const active=(data.users||[]).filter(u=>u.status==='active');const option=active.map(u=>`<option value="${esc(u.id)}">${esc(u.display_name||u.email||u.id)} · ${esc(u.role||'viewer')}</option>`).join('');$('#manager').innerHTML=option;$('#employee').innerHTML=option}async function load(){data=await api('/api/admin/access');fill();render();$('#status').textContent=`${data.users.length} người dùng · ${(data.reporting_lines||[]).length} quan hệ active`;$('#app').hidden=false}$('#search').oninput=render;$('#save').onclick=async()=>{if($('#manager').value===$('#employee').value){$('#message').textContent='Quản lý và nhân viên phải khác nhau';return}try{await api('/api/admin/access',{method:'POST',body:JSON.stringify({action:'set_reporting_line',manager_user_id:$('#manager').value,employee_user_id:$('#employee').value})});$('#message').textContent='Đã lưu quan hệ';await load()}catch(e){$('#message').textContent=e.message}};document.addEventListener('click',async e=>{const id=e.target.dataset.end;if(!id)return;try{await api('/api/admin/access',{method:'POST',body:JSON.stringify({action:'end_reporting_line',employee_user_id:id})});await load()}catch(x){$('#message').textContent=x.message}});(async()=>{const x=await sb.auth.getSession();session=x.data.session;if(!session){$('#status').textContent='Hãy đăng nhập Google trước.';return}try{const p=await api('/api/auth/profile');if(!['platform_admin','super_admin'].includes(p.profile.role))throw Error('Chỉ quản trị viên được quản lý tuyến');await load()}catch(e){$('#status').textContent=e.message}})();</script><script src="/auth-nav.js?v=20261101-7"></script></body></html>
