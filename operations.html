<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vận hành giao dịch</title><link rel="stylesheet" href="system.css?v=20261101-5"><style>main{padding:55px 0}.box{padding:24px;background:#151c20;border:1px solid #354144;border-radius:9px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.input{width:100%;padding:13px;border:1px solid #445155;background:#0c1114;color:#fff;border-radius:6px;font:14px Manrope}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:12px 8px;text-align:left;border-bottom:1px solid #354144;vertical-align:top}.table td{color:#c5cdce}.status{color:#aab3b4;font-size:13px}.hidden{display:none}.tag-state{display:inline-block;padding:3px 6px;border:1px solid #536064;border-radius:4px;font-size:10px;color:var(--lime)}@media(max-width:720px){.grid{grid-template-columns:1fr}.table{display:block;overflow-x:auto}}</style></head>
<body><nav class="nav"><div class="wrap"><a class="brand" href="index.html">AI<span>/</span>FB MONEY</a><div class="navlinks"><a href="dashboard.html">Chỉ số</a><a href="operations.html">Giao dịch</a></div></div></nav><main class="wrap"><section id="login" style="max-width:580px;margin:70px auto"><p class="tag">PRIVATE OPERATIONS</p><h1>Giao dịch &<br><em>bàn giao</em></h1><input id="key" class="input" type="password" placeholder="DASHBOARD_ADMIN_KEY"><p><button class="btn" id="open">MỞ VẬN HÀNH ↗</button></p><p id="error" class="status"></p></section><section id="app" class="hidden"><p class="tag">INVENTORY → DEAL → ACCESS → HANDOVER</p><h1>Vận hành giao dịch</h1><p class="status">Bán đứt chỉ hoàn tất sau khi Page đã release khỏi BM và mọi quyền nội bộ đã được gỡ trong Meta.</p><form id="deal-form" class="box"><h3>Tạo giao dịch</h3><div class="grid"><select class="input" id="page" required><option>Đang tải Page…</option></select><select class="input" id="type"><option value="revenue_share">Vận hành / chia doanh thu</option><option value="outright_sale">Bán đứt</option></select><input class="input" id="title" required placeholder="Tên giao dịch"><input class="input" id="price" type="number" min="0" placeholder="Giá bán (VND, nếu có)"><input class="input" id="share" type="number" min="0.01" max="100" step="0.01" placeholder="Tỷ lệ chia cho đối tác (%)"><input class="input" id="note" placeholder="Ghi chú điều khoản"></div><p><button class="btn">TẠO GIAO DỊCH</button> <span id="form-status" class="status"></span></p></form><div class="box"><h3>Giao dịch</h3><div id="deals" class="status">Đang tải…</div></div><div class="box"><h3>Hồ sơ đang chờ</h3><div id="requests" class="status">Đang tải…</div></div></section></main>
<script>let key='',pages=[];const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':key};const r=await fetch(path,opt),d=await r.json();if(!r.ok)throw Error(d.error||'Không thể thực hiện');return d}function table(rows,heads){return rows.length?`<table class="table"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.join('')}</table>`:'<p class="status">Chưa có dữ liệu.</p>'}async function load(){const [report,ops]=await Promise.all([api('/api/report?limit=1'),api('/api/admin/deals')]);pages=report.pages;$('#page').innerHTML=pages.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.id)}</option>`).join('')||'<option value="">Chưa có Page — chạy cron sync trước</option>';$('#deals').innerHTML=table(ops.deals.map(d=>`<tr><td>${esc(d.title)}<br><small>${esc(d.page?.name||d.page_id)}</small></td><td>${d.deal_type==='revenue_share'?'Chia doanh thu':'Bán đứt'}</td><td><span class="tag-state">${esc(d.status)}</span></td><td>${d.deal_type==='revenue_share'?esc(d.revenue_share_percent)+'%':esc(d.asking_price||'—')+' '+esc(d.currency)}</td></tr>`),['Giao dịch','Loại','Trạng thái','Giá/Tỷ lệ']);$('#requests').innerHTML=table(ops.requests.map(r=>`<tr><td>${esc(r.applicant_name)}<br><small>${esc(r.applicant_email)}</small></td><td>${esc(r.deal?.title||r.deal_id)}</td><td>${esc(r.requested_task)}</td><td><span class="tag-state">${esc(r.status)}</span></td><td>${r.status==='submitted'?`<button class="btn" data-approve="${r.id}" data-deal="${r.deal_id}" data-page="${r.deal?.page_id}">DUYỆT</button>`:'—'}</td></tr>`),['Người đăng ký','Giao dịch','Quyền yêu cầu','Trạng thái','Thao tác']);document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/handover',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'approve_request',request_id:b.dataset.approve,deal_id:b.dataset.deal,page_id:b.dataset.page,note:'Duyệt từ Operations'})});await load()}catch(e){alert(e.message)}})}$('#deal-form').onsubmit=async e=>{e.preventDefault();try{const type=$('#type').value;await api('/api/admin/deals',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({page_id:$('#page').value,deal_type:type,title:$('#title').value,asking_price:$('#price').value||null,revenue_share_percent:type==='revenue_share'?$('#share').value:null,terms_note:$('#note').value})});$('#form-status').textContent='Đã tạo giao dịch.';e.target.reset();await load()}catch(x){$('#form-status').textContent=x.message}}}$('#open').onclick=async()=>{key=$('#key').value;try{await load();$('#login').classList.add('hidden');$('#app').classList.remove('hidden')}catch(e){$('#error').textContent=e.message}};</script></body></html>
<script>if(!document.querySelector('#quick-nav')){document.body.insertAdjacentHTML('afterbegin','<nav id="quick-nav" class="quick-nav"><div><a href="/analytics">Báo cáo</a><a href="/access">Tài sản</a><a href="/groups">Nhóm nội dung</a><a href="/payout">Payout</a><a href="/users">Nhân sự</a><a href="/connect-meta">Kết nối Meta</a></div></nav>');const s=document.createElement('style');s.textContent='.quick-nav{position:sticky;top:0;z-index:1100;background:rgba(11,14,17,.98);border-bottom:1px solid rgba(255,255,255,.14)}.quick-nav>div{width:min(1160px,calc(100% - 44px));margin:auto;display:flex;gap:18px;align-items:center;min-height:52px;overflow:auto}.quick-nav a{color:#c1c6c7;font-size:11px;font-weight:800;white-space:nowrap}.quick-nav a:hover{color:#d6ff3f}';document.head.appendChild(s)}</script>
