<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài sản & phân quyền | AI/FB MONEY</title><link rel="stylesheet" href="/system.css?v=20261101-6"><style>main{padding:32px 0}.hidden{display:none!important}.muted{color:#9aa7aa;font-size:13px}.card{background:#151c20;border:1px solid #354144;border-radius:10px;padding:18px;margin:16px 0}.toolbar,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:center}.toolbar{display:flex;flex-wrap:wrap}.input{background:#101618;color:#fff;border:1px solid #425054;border-radius:6px;padding:10px;box-sizing:border-box}.btn2{background:#1c292d;color:#fff;border:1px solid #425054;border-radius:6px;padding:9px 13px;cursor:pointer}.btn2.primary{background:#c9ff4a;color:#101618;border-color:#c9ff4a}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px 8px;border-bottom:1px solid #354144;text-align:left;vertical-align:top}.pill{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;background:#30383b;color:#c4ccce}.good{background:#173b26;color:#9df2b0}.checks{border:1px solid #354144;border-radius:7px;max-height:330px;overflow:auto;padding:8px}.check{display:flex;gap:8px;padding:8px;border-bottom:1px solid #273337}.check input{accent-color:#c9ff4a}.check small{color:#9aa7aa}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modal-panel{width:min(980px,100%);max-height:90vh;overflow:auto;background:#151c20;border:1px solid #506064;border-radius:10px;padding:20px}.quick-nav{position:sticky;top:0;z-index:10;background:#0b0e11;border-bottom:1px solid #354144}.quick-nav>div{width:min(1160px,calc(100% - 44px));margin:auto;min-height:52px;display:flex;gap:18px;align-items:center;overflow:auto}.quick-nav a{color:#c1c6c7;text-decoration:none;white-space:nowrap;font-size:11px;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.toolbar .input{width:100%}}</style></head><body><nav class="quick-nav"><div><a href="/analytics">Tổng quan</a><a href="/report-pages">Page</a><a href="/report-content">Nội dung</a><a href="/report-revenue">Doanh thu</a><a href="/payout">Payout</a><a href="/commissions">Hoa hồng</a><a href="/groups">Nhóm</a><a href="/users">Nhân sự</a><a href="/account">Tài khoản</a></div></nav><main class="wrap"><p class="tag">ASSET REGISTRY</p><h1>Tài sản & phân quyền</h1><p id="status" class="muted">Đang tải…</p><section id="app" class="hidden"><div class="toolbar"><input id="search" class="input" placeholder="Tìm Page, ID hoặc registry"><select id="scope" class="input"><option value="">Tất cả nguồn</option><option value="bm">Trong BM</option><option value="outside">Ngoài BM</option></select><select id="business" class="input"><option value="">Tất cả BM</option></select><select id="state-filter" class="input"><option value="">Tất cả trạng thái</option><option value="active">Đang hoạt động</option></select><button id="assign-open" class="btn2 primary">Gán người ↔ Page</button><button id="refresh" class="btn2">Làm mới tài sản</button></div><section class="card"><h2>Registry Page</h2><div id="pages"></div></section><section class="card"><h2>BM đang quản lý</h2><div id="businesses"></div></section><section class="card"><h2>Hồ sơ thanh toán</h2><div id="payments"></div></section></section></main><div id="modal" class="modal hidden"><div class="modal-panel"><div class="toolbar"><h2>Gán người ↔ Page</h2><button id="close" class="btn2">Đóng</button></div><div class="grid"><div><input id="user-search" class="input" placeholder="Tìm người"><div><button id="user-all" class="btn2">Chọn tất cả</button> <button id="user-clear" class="btn2">Bỏ chọn</button></div><div id="users" class="checks"></div><p id="user-count" class="muted"></p></div><div><input id="page-search" class="input" placeholder="Tìm Page"><div><button id="page-all" class="btn2">Chọn tất cả</button> <button id="page-clear" class="btn2">Bỏ chọn</button></div><div id="pick-pages" class="checks"></div><p id="page-count" class="muted"></p></div><div><select id="level" class="input"><option value="viewer">Quyền xem</option><option value="manager">Quyền quản lý</option></select><button id="save-access" class="btn2 primary">Lưu gán</button><p id="save-msg" class="muted"></p></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1"></script><script>
const sb=supabase.createClient('https://tlcjcqqnfjrqsoiaalfk.supabase.co','sb_publishable_Q05ypFa4Ele00vyzy5X9Rw_tBWEJuvr');let session,data,usersSelected=new Set(),pagesSelected=new Set();const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Không thể thực hiện');return d}
function render(){const q=($('#search').value||'').toLowerCase(),scope=$('#scope').value,biz=$('#business').value,names=new Map(data.users.map(u=>[u.id,u.display_name||u.email||u.id])),access=data.access||[];const rows=data.pages.filter(p=>(!q||`${p.name} ${p.id} ${p.registry_id}`.toLowerCase().includes(q))&&(!scope||(scope==='bm'?!!p.custodian_business_id:!p.custodian_business_id))&&(!biz||String(p.custodian_business_id||'')===biz));$('#pages').innerHTML=`<table class="table"><tr><th>#</th><th>Page / Registry</th><th>BM / nguồn</th><th>Trạng thái</th><th>Người được gán</th><th>Đồng bộ cuối</th><th></th></tr>${rows.map((p,i)=>`<tr><td>${i+1}</td><td><strong>${esc(p.name)}</strong><br>${p.id}<br><small>${esc(p.registry_id||'Chưa có registry')}</small></td><td>${esc(p.custodian_business_name||p.custodian_business_id||'Ngoài BM')}</td><td><span class="pill ${p.current_status==='active'?'good':''}">${esc(p.current_status||'Chưa xác định')}</span></td><td>${esc(access.filter(a=>a.page_id===p.id).map(a=>names.get(a.user_id)||a.user_id).join(', ')||'Chưa gán')}</td><td>${esc(p.last_synced_at||'—')}</td><td><button class="btn2" data-sync="${p.id}">Đồng bộ</button></td></tr>`).join('')}</table>`;$('#business').innerHTML='<option value="">Tất cả BM</option>'+data.businesses.map(b=>`<option value="${b.id}">${esc(b.name||b.id)}</option>`).join('');$('#businesses').innerHTML=`<table class="table"><tr><th>BM</th><th>ID</th><th>Quản lý</th></tr>${data.businesses.map(b=>`<tr><td>${esc(b.name||'Chưa đặt tên')}</td><td>${b.id}</td><td>${b.managed?'Có':'Không'}</td></tr>`).join('')}</table>`;$('#payments').innerHTML=(data.payment_profiles||[]).length?`<table class="table"><tr><th>Hồ sơ</th><th>Người nhận</th><th>BM</th><th>Trạng thái</th></tr>${data.payment_profiles.map(p=>`<tr><td>${esc(p.profile_name||p.external_id)}</td><td>${esc(p.recipient_name||p.recipient_account||'—')}</td><td>${esc(p.business_id||'—')}</td><td>${esc(p.status||'—')}</td></tr>`).join('')}</table>`:'<p class="muted">Chưa có hồ sơ.</p>'}
function renderPicker(){const uq=($('#user-search').value||'').toLowerCase(),pq=($('#page-search').value||'').toLowerCase();$('#users').innerHTML=data.users.filter(u=>u.role!=='platform_admin'&&u.status!=='deleted'&&`${u.email} ${u.display_name}`.toLowerCase().includes(uq)).map(u=>`<label class="check"><input type="checkbox" data-user value="${u.id}" ${usersSelected.has(u.id)?'checked':''}>${esc(u.display_name||u.email)} <small>${esc(u.role||'viewer')}</small></label>`).join('');$('#pick-pages').innerHTML=data.pages.filter(p=>`${p.name} ${p.id}`.toLowerCase().includes(pq)).map(p=>`<label class="check"><input type="checkbox" data-page value="${p.id}" ${pagesSelected.has(p.id)?'checked':''}>${esc(p.name)} <small>${p.id}</small></label>`).join('');$('#user-count').textContent=`Đang chọn: ${usersSelected.size} người`;$('#page-count').textContent=`Đang chọn: ${pagesSelected.size} Page`}
async function load(){data=await api('/api/admin/access');render();$('#status').textContent=`Đã tải ${data.pages.length} Page · ${data.businesses.length} BM`;$('#app').classList.remove('hidden')}
$('#assign-open').onclick=()=>{$('#modal').classList.remove('hidden');renderPicker()};$('#close').onclick=()=>$('#modal').classList.add('hidden');['search','scope','business'].forEach(id=>$('#'+id).oninput=render);['user-search','page-search'].forEach(id=>$('#'+id).oninput=renderPicker);document.addEventListener('change',e=>{if(e.target.matches('[data-user]'))e.target.checked?usersSelected.add(e.target.value):usersSelected.delete(e.target.value);if(e.target.matches('[data-page]'))e.target.checked?pagesSelected.add(e.target.value):pagesSelected.delete(e.target.value);renderPicker()});$('#user-all').onclick=()=>{data.users.filter(u=>u.role!=='platform_admin'&&u.status!=='deleted').forEach(u=>usersSelected.add(u.id));renderPicker()};$('#page-all').onclick=()=>{data.pages.forEach(p=>pagesSelected.add(p.id));renderPicker()};$('#user-clear').onclick=()=>{usersSelected.clear();renderPicker()};$('#page-clear').onclick=()=>{pagesSelected.clear();renderPicker()};$('#save-access').onclick=async()=>{try{for(const user_id of usersSelected)for(const page_id of pagesSelected)await api('/api/admin/access',{method:'POST',body:JSON.stringify({user_id,page_id,access_level:$('#level').value})});$('#save-msg').textContent=`Đã lưu ${usersSelected.size*pagesSelected.size} liên kết`;await load()}catch(e){$('#save-msg').textContent=e.message}};$('#refresh').onclick=async()=>{try{await api('/api/admin/access',{method:'POST',body:JSON.stringify({action:'refresh_assets'})});await load()}catch(e){$('#status').textContent=e.message}};document.addEventListener('click',async e=>{const id=e.target.dataset.sync;if(!id)return;try{await api('/api/admin/access',{method:'POST',body:JSON.stringify({action:'sync_page',page_id:id})});await load()}catch(x){$('#status').textContent=x.message}});(async()=>{const x=await sb.auth.getSession();session=x.data.session;if(!session){$('#status').textContent='Hãy đăng nhập Google trước.';return}try{const p=await api('/api/auth/profile');if(!['platform_admin','super_admin'].includes(p.profile.role))throw Error('Chỉ quản trị viên được quản lý tài sản');await load()}catch(e){$('#status').textContent=e.message}})();</script><script src="/auth-nav.js?v=20261101-9"></script></body></html>
