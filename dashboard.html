<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta Page Control Tower</title><link rel="stylesheet" href="system.css?v=20261101-4"><style>main{padding:65px 0}.auth{max-width:620px;margin:0 auto}.input{width:100%;padding:14px;border-radius:6px;border:1px solid #465155;background:#151c20;color:#fff;margin:10px 0}.status{color:#aab3b4}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:14px 9px;border-bottom:1px solid #354144;vertical-align:top}.table td{color:#c3cbcc}.table a{color:var(--lime)}.hidden{display:none}.kpis{display:flex;gap:13px;flex-wrap:wrap;margin:24px 0}.kpi{min-width:170px;padding:19px;background:#151c20;border:1px solid #354144;border-radius:7px}.kpi b{display:block;font:700 29px 'Space Grotesk';color:var(--lime)}.kpi span{font-size:11px;color:#aab3b4}</style></head><body><nav class="nav"><div class="wrap"><a class="brand" href="index.html">AI<span>/</span>FB MONEY</a><span class="tag">CONTROL TOWER</span></div></nav><main class="wrap"><section id="login" class="auth"><p class="tag">Private dashboard</p><h1>Meta Page<br><em>Control Tower</em></h1><p class="intro">Nhập khóa quản trị để xem dữ liệu đã đồng bộ. Khóa chỉ được giữ trong phiên tab này.</p><input id="key" class="input" type="password" placeholder="DASHBOARD_ADMIN_KEY"><button class="btn" id="open">MỞ DASHBOARD ↗</button><p id="error" class="status"></p></section><section id="report" class="hidden"><p class="tag">Facebook Pages</p><h1>Tổng quan nội dung</h1><div id="sync" class="status"></div><div class="kpis"><div class="kpi"><b id="page-count">0</b><span>Page truy cập được</span></div><div class="kpi"><b id="post-count">0</b><span>Bài đã đồng bộ</span></div></div><h2>Page</h2><div id="pages"></div><h2 style="margin-top:54px">Nội dung mới nhất</h2><div id="posts"></div></section></main><script>let adminKey='';const e=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/report?limit=100',{headers:{'x-admin-key':adminKey}}),data=await r.json();if(!r.ok)throw Error(data.error||'Không thể tải dữ liệu');e('#login').classList.add('hidden');e('#report').classList.remove('hidden');e('#page-count').textContent=data.pages.length;e('#post-count').textContent=data.posts.length;const s=data.latest_sync;e('#sync').textContent=s?`Đồng bộ gần nhất: ${new Date(s.ran_at).toLocaleString('vi-VN')} · ${s.status}`:'Chưa có lượt đồng bộ nào.';e('#pages').innerHTML=`<table class="table"><tr><th>Page</th><th>Nguồn kết nối</th><th>Danh mục</th></tr>${data.pages.map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.id)}</small></td><td>${esc(p.meta_connection)}</td><td>${esc(p.category||'—')}</td></tr>`).join('')}</table>`;e('#posts').innerHTML=`<table class="table"><tr><th>Page ID</th><th>Thời điểm</th><th>Nội dung</th><th>Loại</th></tr>${data.posts.map(p=>`<tr><td>${esc(p.page_id)}</td><td>${p.created_time?new Date(p.created_time).toLocaleString('vi-VN'):'—'}</td><td>${p.permalink_url?`<a target="_blank" rel="noreferrer" href="${esc(p.permalink_url)}">${esc(p.message||'Xem bài viết')}</a>`:esc(p.message||'—')}</td><td>${esc(p.media_type||'—')}</td></tr>`).join('')}</table>`}e('#open').onclick=async()=>{adminKey=e('#key').value;try{await load()}catch(x){e('#error').textContent=x.message}};</script></body></html>
