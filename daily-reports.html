<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Báo cáo cộng tác viên | FACEBOOK MONEY MASTER</title><link rel="stylesheet" href="/system.css?v=20261119"><link rel="stylesheet" href="/operations-ui.css"></head><body><nav id="quick-nav" class="quick-nav"><div><a class="brand" href="/">FACEBOOK MONEY MASTER</a></div></nav><main class="wrap operations-main"><h1>Báo cáo cộng tác viên</h1><p id="report-status" role="status">Đang kiểm tra tài khoản…</p><section id="submit-card" class="operations-card operations-hidden"><h2>Nộp báo cáo ngày</h2><form id="daily-form" class="operations-form"><label>Fanpage được giao<select name="assignment" class="input" required></select></label><label>Ngày báo cáo<input name="date" class="input" type="date" required></label><label>Số bài đã đăng<input name="posts" class="input" type="number" min="0" step="1" required></label><label>Doanh thu trong ngày (đ)<input name="revenue" class="input" type="number" min="0" step="0.01" required></label><label>Doanh thu luỹ kế hiện tại (đ)<input name="cumulative" class="input" type="number" min="0" step="0.01" required></label><label>Liên kết bằng chứng<input name="source" class="input" type="url" placeholder="https://..."></label><label class="wide">Ghi chú<textarea name="note" class="input" maxlength="4000"></textarea></label><button class="btn2" type="submit">Nộp báo cáo</button></form><p id="submit-status" role="status"></p></section><section id="report-data" class="operations-hidden"><section class="operations-card"><h2>Kết quả vận hành</h2><div class="operations-tools"><label>Từ ngày<input id="report-start" class="input" type="date"></label><label>Đến ngày<input id="report-end" class="input" type="date"></label><button id="report-load" class="btn2">Xem báo cáo</button></div><div id="report-summary" class="operations-stats"></div><p class="operations-muted">Doanh thu tự báo cáo được trình bày riêng với số đã duyệt. Luỹ kế chỉ lấy báo cáo mới nhất của mỗi phân công trong kỳ.</p><h3>Chưa nộp báo cáo ngày cuối kỳ</h3><div id="missing-reports"></div><h3>Tổng hợp theo <select id="group-by" class="input" style="width:auto"><option value="person">Nhân sự</option><option value="page">Fanpage</option></select></h3><div id="group-summary"></div></section><section class="operations-card"><h2>Chi tiết báo cáo</h2><div id="daily-list"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1"></script><script src="/auth-nav.js?v=20261119-operations"></script><script src="/daily-reports.js"></script></body></html>
