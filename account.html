<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tài khoản | FACEBOOK MONEY MASTER</title>
  <link rel="stylesheet" href="system.css?v=20261101-6">
  <style>main{padding:50px 0}.box{padding:22px;background:#151c20;border:1px solid #354144;border-radius:9px;margin:18px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{padding:18px;border:1px solid #354144;border-radius:8px}.kpi b{display:block;color:var(--lime);font-size:28px}.muted{color:#aab3b4;font-size:13px}.hidden{display:none}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}}</style>
</head>
<body>
  <nav id="quick-nav" class="quick-nav"><div><a class="brand" href="/">AI<span>/</span>FB MONEY</a></div></nav>
  <nav class="nav"><div class="wrap"><span class="tag">TÀI KHOẢN</span></div></nav>
  <main class="wrap">
    <p class="tag">ACCOUNT OVERVIEW</p><h1>Tổng quan<br><em>tài khoản</em></h1><p id="status" class="muted">Đang kiểm tra phiên…</p>
    <section id="app" class="hidden">
      <div class="box"><h3 id="identity"></h3><p id="meta" class="muted"></p></div>
      <div class="kpis"><div class="kpi"><b id="page-count">0</b><span>Page được gán</span></div><div class="kpi"><b id="assignment-count">0</b><span>Phân công đang hoạt động</span></div><div class="kpi"><b id="payout-count">0</b><span>Hồ sơ Payout</span></div><div class="kpi"><b id="sync-right">Không</b><span>Quyền đồng bộ</span></div></div>
      <div class="box"><h3>Bạn có thể làm gì?</h3><p id="rights" class="muted"></p><p><a class="btn" href="/analytics">MỞ BÁO CÁO</a> <a class="btn ghost" href="/access">TÀI SẢN ĐƯỢC GÁN</a></p></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1"></script>
  <script src="/auth-nav.js?v=20261119-account-nav"></script>
  <script>
    const sb=supabase.createClient('https://tlcjcqqnfjrqsoiaalfk.supabase.co','sb_publishable_Q05ypFa4Ele00vyzy5X9Rw_tBWEJuvr');
    const $=selector=>document.querySelector(selector);
    (async()=>{
      const session=(await sb.auth.getSession()).data.session;
      if(!session){$('#status').textContent='Bạn chưa đăng nhập. Hãy dùng Đăng nhập trên navigator.';return}
      const response=await fetch('/api/auth/profile',{headers:{Authorization:'Bearer '+session.access_token}});
      const payload=await response.json();
      if(!response.ok){$('#status').textContent=payload.error||'Không thể tải hồ sơ';return}
      const profile=payload.profile;
      $('#identity').textContent=profile.display_name||profile.email||profile.id;
      $('#meta').textContent=`${profile.email||''} · Vai trò: ${profile.role} · Trạng thái: ${profile.status||'active'}`;
      $('#page-count').textContent=(payload.pageIds||[]).length;
      $('#assignment-count').textContent=(payload.assignments||[]).length;
      $('#sync-right').textContent=profile.role==='platform_admin'||profile.role==='manager'?'Có':'Không';
      $('#payout-count').textContent='Theo quyền';
      $('#rights').textContent=profile.role==='platform_admin'?'Toàn quyền nền tảng, quản lý nhân sự, nhóm, Page và Payout.':profile.role==='manager'?'Xem và đồng bộ các Page được gán; quản lý nội dung theo phạm vi được phân công.':'Xem báo cáo các Page được gán; không thể đồng bộ hoặc thay đổi phân quyền.';
      $('#status').textContent='Đã đăng nhập';$('#app').classList.remove('hidden');
    })().catch(error=>{console.error('Không thể tải tài khoản',error);$('#status').textContent='Không thể tải tài khoản. Vui lòng thử lại.'});
  </script>
</body>
</html>
