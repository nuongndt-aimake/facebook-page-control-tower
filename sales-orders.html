<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đơn hàng | FACEBOOK MONEY MASTER</title><link rel="stylesheet" href="/system.css?v=20261101-6"><style>main{padding:32px 0}.hidden{display:none!important}.muted{color:#9aa7aa;font-size:13px}.card{background:#151c20;border:1px solid #354144;border-radius:10px;padding:18px;margin:16px 0}.toolbar,.grid{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.input{background:#101618;color:#fff;border:1px solid #425054;border-radius:6px;padding:10px}.btn2{background:#1c292d;color:#fff;border:1px solid #425054;border-radius:6px;padding:9px 13px;cursor:pointer}.btn2.primary{background:#c9ff4a;color:#101618;border-color:#c9ff4a}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px 8px;border-bottom:1px solid #354144;text-align:left;vertical-align:top}.pill{padding:3px 8px;border-radius:99px;background:#30383b;color:#c4ccce;font-size:11px}.paid{background:#173b26;color:#9df2b0}.pending_payment,.reconciliation_required{background:#4a3610;color:#ffe18a}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modal-panel{width:min(620px,100%);background:#151c20;border:1px solid #506064;border-radius:10px;padding:20px}.quick-nav{position:sticky;top:0;z-index:10;background:#0b0e11;border-bottom:1px solid #354144}.quick-nav>div{width:min(1160px,calc(100% - 44px));margin:auto;min-height:52px;display:flex;gap:18px;align-items:center;overflow:auto}.quick-nav a{color:#c1c6c7;text-decoration:none;white-space:nowrap;font-size:11px;font-weight:800}@media(max-width:680px){main{padding:20px 0}.table{font-size:11px}.table th,.table td{padding:8px 6px}.table td:nth-child(5),.table th:nth-child(5){display:none}}</style></head><body><nav class="quick-nav"><div><a href="/analytics">Tổng quan</a></div></nav><main class="wrap"><p class="tag">SALES LINE</p><h1>Đơn hàng</h1><p id="status" class="muted">Đang tải…</p><section id="app" class="hidden"><div class="toolbar"><input id="search" class="input" placeholder="Tìm mã đơn, khách hàng, email"><select id="payment" class="input"><option value="">Tất cả thanh toán</option><option value="pending_payment">Chờ thanh toán</option><option value="paid">Đã thanh toán</option><option value="reconciliation_required">Cần đối soát</option><option value="expired">Hết hạn</option><option value="cancelled">Đã hủy</option><option value="refunded">Đã hoàn</option></select><button id="reload" class="btn2">Làm mới</button></div><section class="card"><h2>Catalog sản phẩm</h2><div id="products" class="muted"></div></section><section class="card"><h2>Đơn hàng và phân công</h2><div id="orders"></div></section></section></main><div id="modal" class="modal hidden"><div class="modal-panel"><div class="toolbar"><h2 id="modal-title"></h2><button id="close" class="btn2">Đóng</button></div><div id="modal-body"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1"></script><script>const sb=supabase.createClient('https://tlcjcqqnfjrqsoiaalfk.supabase.co','sb_publishable_Q05ypFa4Ele00vyzy5X9Rw_tBWEJuvr');let session,data,users=[];const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Không thể thực hiện');return d}const money=x=>new Intl.NumberFormat('vi-VN').format(Number(x||0))+' đ';function render(){const q=$('#search').value.toLowerCase(),st=$('#payment').value,assign=new Map((data.assignments||[]).map(x=>[x.order_id,x]));$('#products').innerHTML=(data.products||[]).map(x=>`<strong>${esc(x.name)}</strong> · ${esc(x.product_type)} · ${money(x.unit_price_vnd)} · <span class="pill">${esc(x.status)}</span>`).join('<br>')||'Chưa có sản phẩm';const rows=(data.orders||[]).filter(x=>(!q||`${x.order_code} ${x.buyer_name} ${x.buyer_email}`.toLowerCase().includes(q))&&(!st||x.payment_status===st));$('#orders').innerHTML=`<table class="table"><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Sản phẩm</th><th>Số tiền</th><th>Thanh toán</th><th>Phụ trách</th><th>Thao tác</th></tr></thead><tbody>${rows.map(x=>{const a=assign.get(x.id),person=a?users.find(u=>u.id===a.assignee_user_id):null;return `<tr><td><strong>${esc(x.order_code)}</strong><br><span class="muted">${new Date(x.created_at).toLocaleString('vi-VN')}</span></td><td>${esc(x.buyer_name)}<br><span class="muted">${esc(x.buyer_email)}</span></td><td>${esc(x.product?.name||'')}</td><td>${money(x.expected_amount_vnd)}</td><td><span class="pill ${esc(x.payment_status)}">${esc(x.payment_status)}</span></td><td>${esc(person?.display_name||person?.email||'Chưa phân công')}</td><td><button class="btn2" data-assign="${x.id}">Phân công</button> <button class="btn2" data-payment="${x.id}">Đối soát</button></td></tr>`}).join('')}</tbody></table>`}function order(id){return data.orders.find(x=>x.id===id)}function openAssign(id){const x=order(id);$('#modal-title').textContent='Phân công đơn '+x.order_code;const active=users.filter(u=>u.status==='active');$('#modal-body').innerHTML=`<div class="grid"><label>Người phụ trách <select id="assignee" class="input">${active.map(u=>`<option value="${u.id}">${esc(u.display_name||u.email)}</option>`).join('')}</select></label><label>Quản lý <select id="manager" class="input"><option value="">Không chọn</option>${active.map(u=>`<option value="${u.id}">${esc(u.display_name||u.email)}</option>`).join('')}</select></label></div><p><input id="note" class="input" placeholder="Ghi chú bàn giao" style="width:100%"></p><button id="save" class="btn2 primary">Lưu phân công</button> <span id="msg" class="muted"></span>`;$('#modal').classList.remove('hidden');const old=(data.assignments||[]).find(a=>a.order_id===id);if(old){$('#assignee').value=old.assignee_user_id;$('#manager').value=old.manager_user_id||'';$('#note').value=old.handover_note||''}$('#save').onclick=async()=>{try{await api('/api/admin/sales-orders',{method:'POST',body:JSON.stringify({action:'assign_order',order_id:id,assignee_user_id:$('#assignee').value,manager_user_id:$('#manager').value||null,handover_note:$('#note').value||null})});$('#msg').textContent='Đã lưu';await load()}catch(e){$('#msg').textContent=e.message}}}function openPayment(id){const x=order(id);$('#modal-title').textContent='Đối soát '+x.order_code;$('#modal-body').innerHTML=`<p class="muted">Chỉ dùng khi cần xử lý thủ công sau khi kiểm tra sao kê. Webhook SePay là nguồn ghi nhận tự động chính.</p><select id="new-status" class="input">${['pending_payment','paid','reconciliation_required','expired','cancelled','refunded'].map(s=>`<option value="${s}">${s}</option>`).join('')}</select> <button id="save-payment" class="btn2 primary">Lưu trạng thái</button> <span id="msg" class="muted"></span>`;$('#new-status').value=x.payment_status;$('#modal').classList.remove('hidden');$('#save-payment').onclick=async()=>{try{await api('/api/admin/sales-orders',{method:'POST',body:JSON.stringify({action:'set_payment_status',order_id:id,payment_status:$('#new-status').value})});$('#msg').textContent='Đã lưu';await load()}catch(e){$('#msg').textContent=e.message}}}async function load(){[data,access]=await Promise.all([api('/api/admin/sales-orders'),api('/api/admin/access')]);users=access.users||[];render();$('#status').textContent=`${data.orders.length} đơn · ${data.orders.filter(x=>x.payment_status==='paid').length} đã thanh toán`;$('#app').classList.remove('hidden')}$('#close').onclick=()=>$('#modal').classList.add('hidden');$('#reload').onclick=load;$('#search').oninput=render;$('#payment').onchange=render;document.addEventListener('click',e=>{if(e.target.dataset.assign)openAssign(e.target.dataset.assign);if(e.target.dataset.payment)openPayment(e.target.dataset.payment)});(async()=>{session=(await sb.auth.getSession()).data.session;if(!session){$('#status').textContent='Hãy đăng nhập Google trước.';return}try{const p=await api('/api/auth/profile');if(!['platform_admin','super_admin'].includes(p.profile.role))throw Error('Chỉ quản trị viên được xem đơn hàng');await load()}catch(e){$('#status').textContent=e.message}})();</script><script src="/auth-nav.js?v=20261119-sales"></script></body></html>
